name: Temp check
on:
  push:
    branches: [check-icon]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: |
          pnpm biome check --write . || true
          d=$(git diff | head -c 3500 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -n "$d" ] && echo "::error title=diff::$d"
          pnpm biome check --reporter=github .
