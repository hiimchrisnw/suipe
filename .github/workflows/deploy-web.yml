name: Deploy Web

on:
  push:
    branches:
      - main
    # packages/schemas and packages/ui are listed because the web build consumes both.
    paths:
      - "apps/web/**"
      - "packages/schemas/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"

# One deploy at a time, and a newer push supersedes an older one rather than both racing.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @suipe/web build

      - run: pnpm wrangler pages deploy dist --project-name suipe
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
