name: Deploy API

on:
  push:
    branches:
      - main
    # Only what this deploy actually ships. packages/schemas is listed because both workspaces
    # consume it, so a shared type change has to redeploy the Worker too.
    paths:
      - "packages/api/**"
      - "packages/schemas/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"

# One deploy at a time, and a newer push supersedes an older one rather than both racing.
concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm wrangler deploy
        working-directory: packages/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
