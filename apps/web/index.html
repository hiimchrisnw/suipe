<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet" />
    <title>sUIpe</title>
    <script>
      // Runs before first paint so the page never flashes the other theme.
      ;(() => {
        // Pinned while the switcher is parked (SHOW_THEME_TOGGLE in nav.tsx). With no way to
        // change it from the page, following the OS would strand anyone on a light desktop in a
        // palette the design was never drawn for. Set to null to go back to the logic below.
        const PINNED = "dark"
        if (PINNED) {
          document.documentElement.dataset.theme = PINNED
          return
        }
        let stored = null
        try {
          stored = localStorage.getItem("suipe-theme")
        } catch {}
        document.documentElement.dataset.theme =
          stored ?? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
